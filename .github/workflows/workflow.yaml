name: GitHub Workflow - AutoDoc
on:
  workflow_call:
    inputs:
      runs-on:
        description: |
          Runs on, e.g. ubuntu-latest. 
          make sure to enclose in single quotes `'` if using a list:
          `'["self-hosted", "Linux"]'`
        required: true
        type: string
        default: "ubuntu-latest"
      workflow_file:
        description: "Path to the workflow file to document"
        required: true
        type: string
        default: "action.yaml"
      doc_file:
        description: "Path to the markdown file to update with documentation"
        required: true
        type: string
        default: "README.md"
      start_token:
        description: "Token marking the start of the autodoc section"
        required: false
        type: string
        default: "<!-- autodoc start -->"
      end_token:
        description: "Token marking the end of the autodoc section"
        required: false
        type: string
        default: "<!-- autodoc end -->"
      table:
        description: "Format inputs as a markdown table"
        required: false
        type: string
        default: "false"
      debug:
        description: "Print debug messages. 0=none, 1=some, 2=more, 3=all"
        required: false
        type: string
        default: "0"

    outputs:
      autodoc_out:
        description: "If enabled, the generated documentation for inputs, secrets, and outputs"
        value: ${{ jobs.autodoc.outputs.autodoc_out }}
      autodoc_type:
        description: "The type automaticly detected by the script of the input_file documented: workflow or action"
        value: ${{ jobs.autodoc.outputs.autodoc_type }}

jobs:
  autodoc:
    name: Create documentation from workflow/action file
    runs-on: ${{ fromJson(inputs.runs-on) }}
    permissions:
      contents: write
    outputs:
      autodoc_out: ${{ toJson(steps.doc_output.outputs.autodoc_out) }}
      autodoc_type: ${{ steps.doc_output.outputs.file_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Update documentation
        id: doc_output
        uses: nrkno/github-action-action-workflow-autodoc@ba51d36126ad4188605d20accd94f66ed502e0e2 # v2
        with:
          workflow_file: ${{ inputs.workflow_file }}
          doc_file: ${{ inputs.doc_file }}
          start_token: ${{ inputs.start_token }}
          end_token: ${{ inputs.end_token }}
          table: ${{ inputs.table }}
          debug: ${{ inputs.debug }}

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          commit_message: "docs(autodoc): update documentation"
