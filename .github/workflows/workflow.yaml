name: GitHub Workflow - AutoDoc
on:
  workflow_call:
    inputs:
      runs-on:
        description: |
          Runner label, e.g. ubuntu-latest. A plain label, a JSON string
          (`'"ubuntu-latest"'`) or a JSON list (`'["self-hosted", "Linux"]'`)
          are all accepted. Enclose JSON in single quotes `'`.
        required: false
        type: string
        default: "ubuntu-latest"
      workflow_file:
        description: "Path to the workflow file to document"
        required: false
        type: string
        default: "action.yaml"
      doc_file:
        description: "Path to the markdown file to update with documentation"
        required: false
        type: string
        default: "README.md"
      start_token:
        description: "Token marking the start of the autodoc section"
        required: false
        type: string
        default: "<!-- autodoc start -->"
      end_token:
        description: "Token marking the end of the autodoc section"
        required: false
        type: string
        default: "<!-- autodoc end -->"
      table:
        description: "Format inputs as a markdown table"
        required: false
        type: string
        default: "false"
      debug:
        description: "Print debug messages. 0=none, 1=some, 2=more, 3=all"
        required: false
        type: string
        default: "0"

    outputs:
      autodoc_out:
        description: "If enabled, the generated documentation for inputs, secrets, and outputs"
        value: ${{ jobs.autodoc.outputs.autodoc_out }}
      autodoc_type:
        description: "The type automaticly detected by the script of the input_file documented: workflow or action"
        value: ${{ jobs.autodoc.outputs.autodoc_type }}

# The default token is read-only; each job below opts in to what it needs.
permissions: {}

# Two jobs, so the write token never shares a job with the autodoc container.
# A container action can write GITHUB_ENV, GITHUB_PATH and the workspace
# (including .git/config), which would let it run code in, or redirect, every
# later step of the same job.
#
#   autodoc  contents: read. Runs the action and uploads doc_file as an artifact.
#   push     contents: write. Fresh checkout, verifies the artifact is exactly
#            one regular file, copies it to doc_file, commits and pushes.
jobs:
  autodoc:
    name: Create documentation from workflow/action file
    # A plain label, a JSON string, a JSON list or a JSON object, with optional
    # leading whitespace. fromJson would fail on a plain label.
    runs-on: ${{ (startsWith(inputs.runs-on, '[') || startsWith(inputs.runs-on, '"') || startsWith(inputs.runs-on, '{') || startsWith(inputs.runs-on, ' ') || startsWith(inputs.runs-on, fromJson('"\t"')) || startsWith(inputs.runs-on, fromJson('"\n"')) || startsWith(inputs.runs-on, fromJson('"\r"'))) && fromJson(inputs.runs-on) || inputs.runs-on }}
    # Fork PRs get a read-only token and their branch does not exist in this
    # repository, so there is nothing to push to.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    outputs:
      autodoc_out: ${{ toJson(steps.doc_output.outputs.autodoc_out) }}
      autodoc_type: ${{ steps.doc_output.outputs.file_type }}
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      # Trust model: the checked-out branch is DATA ONLY and this job holds no
      # write token. Anything the action does here can at most change the
      # contents of the one file that the push job later accepts.

      # Start from a fresh repository: see the same step in the push job.
      - name: Remove any previous .git
        run: rm -rf -- "${GITHUB_WORKSPACE}/.git"

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Chosen before the action runs. A random suffix keeps several calls of
      # this workflow in one run (for example two jobs documenting README.md)
      # from colliding on the artifact name.
      - name: Choose artifact name
        id: artifact
        run: |
          suffix="$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          echo "name=autodoc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${suffix}" >> "$GITHUB_OUTPUT"

      - name: Update documentation
        id: doc_output
        # TODO(bump): move to the release of nrkno/github-action-action-workflow-autodoc
        # that builds its image from the Dockerfile (security/sweep-2026-11), then run `gh actions-lock`.
        uses: nrkno/github-action-action-workflow-autodoc@v2.2.0
        with:
          workflow_file: ${{ inputs.workflow_file }}
          doc_file: ${{ inputs.doc_file }}
          start_token: ${{ inputs.start_token }}
          end_token: ${{ inputs.end_token }}
          table: ${{ inputs.table }}
          debug: ${{ inputs.debug }}

      - name: Upload documentation
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ inputs.doc_file }}
          if-no-files-found: error
          retention-days: 1

  push:
    name: Commit and push documentation
    needs: autodoc
    runs-on: ${{ (startsWith(inputs.runs-on, '[') || startsWith(inputs.runs-on, '"') || startsWith(inputs.runs-on, '{') || startsWith(inputs.runs-on, ' ') || startsWith(inputs.runs-on, fromJson('"\t"')) || startsWith(inputs.runs-on, fromJson('"\n"')) || startsWith(inputs.runs-on, fromJson('"\r"'))) && fromJson(inputs.runs-on) || inputs.runs-on }}
    if: needs.autodoc.result == 'success'
    permissions:
      contents: write
    env:
      # Ignore system and user git configuration; hooks and fsmonitor are also
      # switched off on every command below.
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
      # Pathspecs are literal: no magic, globs or `:(top)` from file names.
      GIT_LITERAL_PATHSPECS: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      # A fresh checkout of the same commit: nothing from the autodoc job's
      # workspace (.git/config, hooks, symlinks) is reused here.
      #
      # Persistent self-hosted runners keep the workspace between jobs, and
      # checkout reuses an existing .git, including its config. A planted
      # url.<x>.insteadOf, core.sshCommand or core.fsmonitor would then act on
      # checkout's own authenticated fetch, before any check of ours could run.
      # Removing .git first makes checkout start from a fresh repository, so
      # nothing of the previous contents is trusted. (An allowlist of config
      # keys checked after checkout would come too late for that fetch.)
      - name: Remove any previous .git
        run: rm -rf -- "${GITHUB_WORKSPACE}/.git"

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download documentation
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.autodoc.outputs.artifact }}
          path: ${{ runner.temp }}/autodoc-artifact

      - name: Commit documentation
        id: commit
        env:
          DOC_FILE: ${{ inputs.doc_file }}
          ARTIFACT_DIR: ${{ runner.temp }}/autodoc-artifact
        run: |
          # File names are never echoed: they come from the branch or the
          # artifact and could carry newlines or `::` workflow commands.
          doc="${DOC_FILE#./}"
          if [[ -z "$doc" || "$doc" == /* || "$doc" == ".." || "$doc" == ../* || "$doc" == */../* || "$doc" == */.. ]]
          then
            echo "::error::doc_file must be a relative path inside the repository"
            exit 1
          fi
          root="$(realpath -e .)"
          if [[ ! -f "$doc" || "$(realpath -e -- "$doc")" != "${root}/${doc}" ]]
          then
            echo "::error::doc_file must be a regular file with no symlinked path component"
            exit 1
          fi

          # The artifact must hold exactly one entry, and it must be a regular
          # file (find -P does not follow links and reports them as type l).
          mapfile -d '' -t kinds < <(find -P "$ARTIFACT_DIR" -mindepth 1 -printf '%y\0')
          if (( ${#kinds[@]} != 1 )) || [[ "${kinds[0]}" != "f" ]]
          then
            echo "::error::The documentation artifact must be exactly one regular file"
            exit 1
          fi
          IFS= read -r -d '' src < <(find -P "$ARTIFACT_DIR" -mindepth 1 -type f -print0)
          if (( "$(stat -c %s -- "$src")" > 10485760 ))
          then
            echo "::error::The documentation artifact is larger than 10 MiB"
            exit 1
          fi

          cp --no-preserve=mode,ownership -- "$src" "$doc"

          if [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 -- "$doc")" ]]
          then
            echo "Nothing to do!"
            exit 0
          fi

          git -c core.hooksPath=/dev/null -c core.fsmonitor=false add -- "$doc"
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            -c commit.gpgsign=false \
            commit -m "docs(autodoc): update documentation"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push documentation update
        if: steps.commit.outputs.changed == 'true'
        # The only step that sees the write token. It runs git and nothing else.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DOC_FILE: ${{ inputs.doc_file }}
          GIT_EDITOR: ":"
        run: |
          # Output is discarded: the name comes from the branch and is untrusted.
          if ! git check-ref-format --branch "$HEAD_REF" > /dev/null 2>&1
          then
            echo "::error::Unexpected branch name"
            exit 1
          fi
          doc="${DOC_FILE#./}"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          # An explicit URL, so no remote configured in .git/config is used.
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          # Every git command: no hooks, no fsmonitor, no credential helper
          # (system and user config are already ignored by the job env).
          git_h() {
            git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c credential.helper= \
              -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" "$@"
          }

          # The commit sits on the head SHA. Callers can run this workflow
          # more than once per pull request (for example one call per
          # documented file), so another call may push first. A rejected push
          # is then retried, at most 3 times, by replaying only this commit
          # on the new branch tip. The artifact is NOT copied again: the
          # replay is a normal three-way merge, so edits to other parts of
          # doc_file survive and a real conflict fails the job.
          base="$HEAD_SHA"
          retries=0
          until git_h push "$url" "HEAD:refs/heads/${HEAD_REF}"
          do
            if (( retries >= 3 ))
            then
              echo "::error::The push was still rejected after 3 rebases"
              exit 1
            fi
            retries=$((retries + 1))
            echo "::warning::Push rejected, rebasing onto the new branch tip (attempt ${retries} of 3)"

            git_h fetch --no-tags "$url" "refs/heads/${HEAD_REF}"
            tip="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
            if [[ "$tip" == "$base" ]]
            then
              echo "::error::The push was rejected but the branch has not moved"
              exit 1
            fi
            # Only a branch that kept the head SHA in its history, and that
            # changed nothing but doc_file since, may be rebased onto. Anything
            # else (force-push, new commits to other files) means the
            # documentation is stale: fail, and the next run regenerates it.
            if ! git merge-base --is-ancestor "$HEAD_SHA" "$tip"
            then
              echo "::error::The branch no longer contains the commit this run documented"
              exit 1
            fi
            others=0
            while IFS= read -r -d '' changed
            do
              [[ "$changed" == "$doc" ]] || others=$((others + 1))
            done < <(git diff --name-only -z --no-renames "$HEAD_SHA" "$tip")
            if (( others > 0 ))
            then
              echo "::error::The branch changed ${others} file(s) other than doc_file since this run started"
              exit 1
            fi

            if ! git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              -c commit.gpgsign=false \
              rebase --onto "$tip" "$base"
            then
              git -c core.hooksPath=/dev/null -c core.fsmonitor=false rebase --abort || true
              echo "::error::Rebasing the documentation commit onto the new branch tip conflicted"
              exit 1
            fi
            base="$tip"
          done
