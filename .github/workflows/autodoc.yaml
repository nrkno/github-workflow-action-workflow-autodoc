on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autodoc:
    name: Auto-generated workflow documentation
    uses: nrkno/github-workflow-action-workflow-autodoc/.github/workflows/workflow.yaml@bb1df87366ced81a134510040b9a4cc74a7410e0 # v1.0.0
    with:
      runs-on: '["nrk-azure-intern","linux"]'
      workflow_file: .github/workflows/workflow.yaml
      doc_file: README.md
      start_token: "<!-- start -->"
      end_token: "<!-- end -->"
      table: "true"
      github_output: "true"
