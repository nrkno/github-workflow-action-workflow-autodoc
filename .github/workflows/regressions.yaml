name: Workflow regressions

on:
  pull_request:
    paths:
      - '.github/workflows/actions.lock'
      - '.github/workflows/autodoc.yaml'
      - '.github/workflows/regressions.yaml'
      - '.github/workflows/workflow.yaml'
      - 'tests/**'

permissions: {}

jobs:
  regressions:
    name: Test workflow steps and expressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run workflow regressions
        shell: bash
        run: bash tests/check.sh
